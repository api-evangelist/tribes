name: Tribes
description: >-
  Tribes (Tribes Protocol, Inc.) is a web3-native social wallet and messaging application
  that lets people co-own and manage digital assets together while communicating directly
  from within the wallet itself. Its "co-wallets" combine group messaging and shared custody
  so crypto communities, creators, and DAOs can coordinate and make decisions without relying
  on external tools like Discord or Twitter. Founded by former Coinbase engineer Hish
  Bouabdallah, Tribes raised a $3.3M pre-seed round in January 2023 led by Kindred Ventures,
  with South Park Commons and Script Capital. It is a consumer crypto product; its public code
  surface is the tribes-protocol GitHub organization (smart-contract libraries and tooling)
  rather than a hosted REST/GraphQL developer API.
